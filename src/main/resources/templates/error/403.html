<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Access denied')}"></head>
<body class="auth-body">
<div class="auth-wrap">
    <div class="auth-card" style="text-align:center;">
        <p class="error-status">403</p>
        <h1 class="auth-title">Access denied</h1>
        <p class="auth-subtitle" th:text="${errorMessage} ?: 'You do not have permission to view this page.'">You do not have permission to view this page.</p>
        <div class="error-actions">
            <a th:href="@{/dashboard}" class="btn btn-primary">Go to dashboard</a>
            <a th:href="@{/}" class="btn btn-secondary">Back to home</a>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Room form')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('rooms')}"></aside>
    <div class="app-content">
        <header th:replace="~{fragments/header :: topbar('Room')}"></header>
        <main class="main-content">
            <div class="page">

                <div class="page-head">
                    <div>
                        <h1 class="page-title" th:text="${roomDto.id} == null ? 'New room' : 'Edit room'">New room</h1>
                        <p class="page-subtitle">Add or update a room and its nightly rate.</p>
                    </div>
                </div>

                <div th:replace="~{fragments/components :: alert('error', ${errorMessage})}"></div>

                <section class="card">
                    <form th:action="@{/admin/rooms}" th:object="${roomDto}" method="post" class="form">
                        <input type="hidden" th:field="*{id}">

                        <div class="form-grid">
                            <div class="field">
                                <label class="field__label" for="roomNumber">Room number</label>
                                <input class="input" type="text" id="roomNumber" th:field="*{roomNumber}" required autofocus>
                            </div>
                            <div class="field">
                                <label class="field__label" for="floor">Floor</label>
                                <input class="input" type="number" id="floor" th:field="*{floor}" min="0" required>
                            </div>
                            <div class="field">
                                <label class="field__label" for="roomTypeId">Room type</label>
                                <select class="input" id="roomTypeId" th:field="*{roomTypeId}" required>
                                    <option th:each="rt : ${roomTypes}" th:value="${rt.id}" th:text="${rt.name}"></option>
                                </select>
                            </div>
                            <div class="field">
                                <label class="field__label" for="pricePerNight">Price per night</label>
                                <input class="input" type="number" step="0.01" id="pricePerNight" th:field="*{pricePerNight}" min="0" required>
                            </div>
                            <div class="field">
                                <label class="field__label" for="status">Status</label>
                                <select class="input" id="status" th:field="*{status}" required>
                                    <option th:each="s : ${T(com.example.app.model.enums.RoomStatus).values()}"
                                            th:value="${s}" th:text="${s}"></option>
                                </select>
                            </div>
                            <div class="field">
                                <label class="field__label" for="description">Description</label>
                                <textarea class="input" id="description" th:field="*{description}" rows="3"></textarea>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save</button>
                            <a th:href="@{/admin/rooms}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </section>

            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>

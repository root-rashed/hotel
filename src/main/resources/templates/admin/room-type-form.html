<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Room type form')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('room-types')}"></aside>
    <div class="app-content">
        <header th:replace="~{fragments/header :: topbar('Room type')}"></header>
        <main class="main-content">
            <div class="page">

                <div class="page-head">
                    <div>
                        <h1 class="page-title" th:text="${roomTypeDto.id} == null ? 'New room type' : 'Edit room type'">New room type</h1>
                        <p class="page-subtitle">Define the category, capacity and base price.</p>
                    </div>
                </div>

                <div th:replace="~{fragments/components :: alert('error', ${errorMessage})}"></div>

                <section class="card">
                    <form th:action="@{/admin/room-types}" th:object="${roomTypeDto}" method="post" class="form">
                        <input type="hidden" th:field="*{id}">

                        <div class="form-grid">
                            <div class="field">
                                <label class="field__label" for="name">Name</label>
                                <input class="input" type="text" id="name" th:field="*{name}" required autofocus>
                            </div>
                            <div class="field">
                                <label class="field__label" for="capacity">Capacity</label>
                                <input class="input" type="number" id="capacity" th:field="*{capacity}" min="1" required>
                            </div>
                            <div class="field">
                                <label class="field__label" for="basePrice">Base price</label>
                                <input class="input" type="number" step="0.01" id="basePrice" th:field="*{basePrice}" min="0" required>
                            </div>
                            <div class="field">
                                <label class="field__label" for="description">Description</label>
                                <textarea class="input" id="description" th:field="*{description}" rows="3"></textarea>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save</button>
                            <a th:href="@{/admin/room-types}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </section>

            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>

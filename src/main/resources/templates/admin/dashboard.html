<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin dashboard')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></aside>
    <div class="app-content">
        <header th:replace="~{fragments/header :: topbar('Admin dashboard')}"></header>
        <main class="main-content">
            <div class="page">

                <div class="page-head">
                    <div>
                        <h1 class="page-title">Admin dashboard</h1>
                        <p class="page-subtitle">A live overview of rooms, bookings and revenue.</p>
                    </div>
                </div>

                <section class="stat-grid" aria-label="Key figures">
                    <div class="stat-card">
                        <span class="stat-card__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></svg>
                        </span>
                        <div class="stat-card__body">
                            <div class="stat-card__label">Total rooms</div>
                            <div class="stat-card__value" th:text="${totalRooms}">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></svg>
                        </span>
                        <div class="stat-card__body">
                            <div class="stat-card__label">Available</div>
                            <div class="stat-card__value" th:text="${availableRooms}">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        </span>
                        <div class="stat-card__body">
                            <div class="stat-card__label">Occupied</div>
                            <div class="stat-card__value" th:text="${occupiedRooms}">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                        </span>
                        <div class="stat-card__body">
                            <div class="stat-card__label">Total bookings</div>
                            <div class="stat-card__value" th:text="${totalBookings}">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <div class="stat-card__body">
                            <div class="stat-card__label">Customers</div>
                            <div class="stat-card__value" th:text="${totalCustomers}">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        </span>
                        <div class="stat-card__body">
                            <div class="stat-card__label">Revenue</div>
                            <div class="stat-card__value" th:text="'$' + ${revenue}">$0</div>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <header class="card__header">
                        <h2 class="card__title">Recent bookings</h2>
                        <a th:href="@{/admin/bookings}" class="btn btn-secondary btn-sm">View all</a>
                    </header>
                    <div class="table-wrap">
                        <table class="table" aria-label="Recent bookings">
                            <thead>
                                <tr>
                                    <th>Reference</th>
                                    <th>Customer</th>
                                    <th>Room</th>
                                    <th>Check-in</th>
                                    <th>Check-out</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="b : ${recentBookings}">
                                    <td class="table__title" th:text="${b.bookingReference}">BK123</td>
                                    <td th:text="${b.customerName}">Jane Doe</td>
                                    <td th:text="${b.roomNumber}">101</td>
                                    <td th:text="${b.checkInDate}">2026-01-01</td>
                                    <td th:text="${b.checkOutDate}">2026-01-05</td>
                                    <td>
                                        <th:block th:replace="~{fragments/components :: statusBadge(${b.bookingStatus})}"></th:block>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(recentBookings)}"
                                    th:replace="~{fragments/components :: emptyRow('No bookings yet.', 6)}"></tr>
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Book a room')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('browse-rooms')}"></aside>
    <div class="app-content">
        <header th:replace="~{fragments/header :: topbar('Book a room')}"></header>
        <main class="main-content">
            <div class="page">

                <div class="page-head">
                    <div>
                        <h1 class="page-title">Book a room</h1>
                        <p class="page-subtitle">Choose your dates to confirm the reservation.</p>
                    </div>
                </div>

                <div th:replace="~{fragments/components :: alert('error', ${errorMessage})}"></div>

                <section class="card">
                    <form th:action="@{/customer/bookings}" th:object="${bookingRequestDto}" method="post"
                          class="form" id="bookingForm">
                        <input type="hidden" th:field="*{roomId}">

                        <div class="form-grid">
                            <div class="field">
                                <label class="field__label" for="checkInDate">Check-in date</label>
                                <input class="input" type="date" id="checkInDate" th:field="*{checkInDate}" required>
                            </div>
                            <div class="field">
                                <label class="field__label" for="checkOutDate">Check-out date</label>
                                <input class="input" type="date" id="checkOutDate" th:field="*{checkOutDate}" required>
                            </div>
                            <div class="field">
                                <label class="field__label" for="numberOfGuests">Number of guests</label>
                                <input class="input" type="number" id="numberOfGuests" th:field="*{numberOfGuests}" min="1" required>
                            </div>
                        </div>

                        <p class="estimate" id="priceEstimate"></p>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Confirm booking</button>
                            <a th:href="@{/customer/rooms}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </section>

            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
<script th:src="@{/js/booking.js}"></script>
</body>
</html>

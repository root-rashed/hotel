<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Users')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('users')}"></aside>
    <div class="app-content">
        <header th:replace="~{fragments/header :: topbar('Users')}"></header>
        <main class="main-content">
            <div class="page">

                <div class="page-head">
                    <div>
                        <h1 class="page-title">Users</h1>
                        <p class="page-subtitle">Staff and customer accounts.</p>
                    </div>
                    <div class="page-actions">
                        <a th:href="@{/admin/users/new}" class="btn btn-primary">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                            New user
                        </a>
                    </div>
                </div>

                <div th:replace="~{fragments/components :: alert('error', ${errorMessage})}"></div>

                <section class="card">
                    <div class="table-wrap">
                        <table class="table" aria-label="Users">
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th class="table__cell-num">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="u : ${users}">
                                    <td class="table__title" th:text="${u.username}">jdoe</td>
                                    <td th:text="|${u.firstName} ${u.lastName}|">Jane Doe</td>
                                    <td th:text="${u.email}">jane@example.com</td>
                                    <td><span class="badge" th:text="${u.role}">RECEPTIONIST</span></td>
                                    <td>
                                        <span th:if="${u.enabled}" class="badge badge--success">Enabled</span>
                                        <span th:unless="${u.enabled}" class="badge badge--danger">Disabled</span>
                                    </td>
                                    <td>
                                        <div class="table-actions">
                                            <a th:href="@{/admin/users/{id}/edit(id=${u.id})}" class="btn btn-ghost btn-sm">Edit</a>
                                            <form th:action="@{/users/{id}/enabled(id=${u.id})}" method="post" class="inline-form">
                                                <input type="hidden" name="enabled" th:value="${!u.enabled}">
                                                <button type="submit" class="btn btn-ghost btn-sm" th:text="${u.enabled} ? 'Disable' : 'Enable'">Disable</button>
                                            </form>
                                            <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                                                  class="inline-form" data-confirm="Are you sure you want to delete this user? This cannot be undone.">
                                                <button type="submit" class="btn btn-danger-ghost btn-sm">Delete</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(users)}"
                                    th:replace="~{fragments/components :: emptyRow('No users found.', 6)}"></tr>
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>

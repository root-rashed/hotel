<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Room types')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('room-types')}"></aside>
    <div class="app-content">
        <header th:replace="~{fragments/header :: topbar('Room types')}"></header>
        <main class="main-content">
            <div class="page">

                <div class="page-head">
                    <div>
                        <h1 class="page-title">Room types</h1>
                        <p class="page-subtitle">Categories define capacity and base pricing.</p>
                    </div>
                    <div class="page-actions">
                        <a th:href="@{/admin/room-types/new}" class="btn btn-primary">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                            New room type
                        </a>
                    </div>
                </div>

                <div th:replace="~{fragments/components :: alert('error', ${errorMessage})}"></div>

                <section class="card">
                    <div class="table-wrap">
                        <table class="table" aria-label="Room types">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Capacity</th>
                                    <th class="table__cell-num">Base price</th>
                                    <th class="table__cell-num">Rooms</th>
                                    <th class="table__cell-num">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="rt : ${roomTypes}">
                                    <td class="table__title" th:text="${rt.name}">Double</td>
                                    <td th:text="${rt.capacity}">2</td>
                                    <td class="table__cell-num" th:text="'$' + ${rt.basePrice}">$100</td>
                                    <td class="table__cell-num" th:text="${rt.roomCount}">4</td>
                                    <td>
                                        <div class="table-actions">
                                            <a th:href="@{/admin/room-types/{id}/edit(id=${rt.id})}" class="btn btn-ghost btn-sm">Edit</a>
                                            <form th:action="@{/admin/room-types/{id}/delete(id=${rt.id})}" method="post"
                                                  class="inline-form" data-confirm="Are you sure you want to delete this room type? This cannot be undone.">
                                                <button type="submit" class="btn btn-danger-ghost btn-sm">Delete</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(roomTypes)}"
                                    th:replace="~{fragments/components :: emptyRow('No room types found.', 5)}"></tr>
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>

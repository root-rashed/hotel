<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Something went wrong')}"></head>
<body class="auth-body">
<div class="auth-wrap">
    <div class="auth-card" style="text-align:center;">
        <p class="error-status" style="color:var(--color-error);">500</p>
        <h1 class="auth-title">Something went wrong</h1>
        <p class="auth-subtitle" th:text="${errorMessage} ?: 'An unexpected error occurred. Please try again later.'">An unexpected error occurred. Please try again later.</p>
        <div class="error-actions">
            <a th:href="@{/dashboard}" class="btn btn-primary">Go to dashboard</a>
            <a th:href="@{/}" class="btn btn-secondary">Back to home</a>
        </div>
    </div>
</div>
</body>
</html>
